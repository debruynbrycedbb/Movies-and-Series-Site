<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bryce's CineVault</title>
<meta name="theme-color" content="#08090d">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235ee0ff'/><rect x='22' y='26' width='56' height='48' rx='6' fill='%2308090d'/><circle cx='36' cy='40' r='5' fill='%235ee0ff'/><circle cx='64' cy='40' r='5' fill='%235ee0ff'/><rect x='30' y='56' width='40' height='6' rx='3' fill='%235ee0ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<main class="login-wrap">
  <div class="login-brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#08090d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2 9h20M7 4v5M17 4v5"/>
      </svg>
    </span>
    <span class="brand-text">Bryce's Cine<em>Vault</em></span>
  </div>

  <div class="login-card">
    <div class="segmented login-tabs" role="tablist">
      <button data-tab="in" class="on" role="tab">Sign in</button>
      <button data-tab="join" role="tab">Join</button>
    </div>

    <form id="inForm" autocomplete="on">
      <p class="login-lede">Welcome back. Sign in with your name and PIN.</p>
      <label class="lf">
        <span>Username</span>
        <input name="username" id="inUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="lf">
        <span>PIN</span>
        <input name="pin" id="inPin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary lbtn" type="submit">Sign in</button>
    </form>

    <form id="joinForm" autocomplete="off" hidden>
      <p class="login-lede">Members only. You'll need the family code from Bryce.</p>
      <label class="lf">
        <span>Family code</span>
        <input id="jCode" type="password" autocomplete="off" required>
      </label>
      <label class="lf">
        <span>Pick a username</span>
        <input id="jUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
        <small>2–20 characters: letters, numbers, - or _. Other members will see it.</small>
      </label>
      <label class="lf">
        <span>Pick a PIN</span>
        <input id="jPin" type="password" inputmode="numeric" autocomplete="new-password" required>
        <small>At least 4 characters. There's no email, so if you forget it, ask Bryce to reset it.</small>
      </label>
      <label class="lf">
        <span>PIN again</span>
        <input id="jPin2" type="password" inputmode="numeric" autocomplete="new-password" required>
      </label>
      <button class="btn btn-primary lbtn" type="submit">Create my vault</button>
    </form>

    <div class="login-msg" id="msg" role="alert" hidden></div>
  </div>

  <p class="login-foot">No email, no personal details — just a name and a PIN.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="login.js"></script>
</body>
</html>
